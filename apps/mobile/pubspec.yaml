name: ulearn
description: U Learn – Educational platform for students and professionals.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  screen_protector: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
