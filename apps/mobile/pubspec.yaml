name: ulearn
description: U Learn – Educational platform for students and professionals.
publish_to: "none"
version: 1.0.19+21

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  screen_protector: ^1.4.2
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  video_compress: ^3.1.4
  flutter_cache_manager: ^3.4.1
  flutter_to_airplay: ^2.1.0
  pdfx: ^2.9.2
  printing: ^5.14.3
  ffmpeg_kit_flutter_new: ^4.3.2
  fvp: ^0.37.3
  video_compress_kit: ^0.0.3
  gal: ^2.3.1
  flutter_markdown: ^0.7.7+1
  in_app_purchase: ^3.2.1
  in_app_purchase_storekit: ^0.4.0
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.4
  record: ^6.2.1
  archive: ^4.0.9
  path: ^1.9.1
  uuid: ^4.6.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/l10n/
    - assets/iap/

# App icons are rendered from the code-based logo painter
# (see test/generate_brand_assets_test.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#050510"
  adaptive_icon_foreground: assets/brand/icon_foreground.png

# Native launch screen shown before Flutter boots, matching the
# in-app animated splash (light + dark).
flutter_native_splash:
  color: "#F4F6FB"
  color_dark: "#050510"
  image: assets/brand/splash_logo.png
  image_dark: assets/brand/splash_logo.png
  android_12:
    color: "#F4F6FB"
    color_dark: "#050510"
    image: assets/brand/splash_logo.png
    image_dark: assets/brand/splash_logo.png
